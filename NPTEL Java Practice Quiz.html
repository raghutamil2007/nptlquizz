lass in Java?"}],"opts":["scanner.readLine()","scanner.nextLine()","scanner.getLine()","scanner.fetchLine()"],"ans":1,"sol":"The nextLine() method of the Scanner class reads a line of text from the console. Refer to Lecture 10 for more details."},{"n":2,"stem":[{"t":"text","v":"What will be the output of the following Java program?"},{"t":"code","v":"public class VarPrint {\n    int x = 30;\n    static int y = 20;\n    public static void main(String[] args) {\n        VarPrint t1 = new VarPrint();\n        t1.x = 99;\n        t1.y = 88;\n        int z1 = t1.x + t1.y;\n        VarPrint t2 = new VarPrint();\n        System.out.println(t2.x + \" \" + t2.y + \" \" + z1);\n    }\n}"}],"opts":["30 99 178","30 88 129","30 99 187","30 88 187"],"ans":3,"sol":"If you perform any change for instance variable these changes won’t be reflected for the remaining objects. Because for every object a separate copy of instance variable will be there. But if you do any change to the static variable, that change will be reflected for all objects because a static instance maintains a single copy in memory. Please refer to chapter 3 of book Joy With Java for a more detailed explaination."},{"n":3,"stem":[{"t":"text","v":"What will be the output of the following Java program?"},{"t":"code","v":"public class ArgumenTest {\n    public static void main(String[] args) {\n        Test t = new Test();\n        t.start();\n    }\n    static class Test {\n        void start() {\n            int a = 4;\n            int b = 5;\n            System.out.print(\"\" + 8 + 3 + \"\");\n            System.out.print(a + b);\n            System.out.print(\" \" + a + b + \"\");\n            System.out.print( a + b + \"\");\n            System.out.print(foo() + a + b + \" \");\n            System.out.println(a + b + foo());\n        }\n        String foo() {\n            return \"foo\";\n        }\n    }\n}"}],"opts":["9 7 7 foo34 34foo","839 45foo45 9foo","839 459foo45 9foo","9 7 7 foo 7 7foo"],"ans":2,"sol":"Here, print() methods internally converts the data in its argument into a String object and then print the composition. Here, + is the concatenation of different String representation. Please refer to chapter 3 of book Joy With Java for a more detailed explaination."},{"n":4,"stem":[{"t":"text","v":"What is encapsulation in object-oriented programming?"}],"opts":["Hiding implementation details and exposing only functionality","The process of creating multiple objects in a program","Writing multiple methods in a single class","Using the this keyword to reference an object"],"ans":0,"sol":"Please refer to chapter 3 of book Joy With Java for a more detailed explaination. Encapsulation is one of the fundamental principles of object-oriented programming. It involves bundling the data (variables) and the methods (functions) that operate on the data into a single unit, typically a class. By making certain data private and providing public methods to access or modify it, encapsulation helps hide implementation details from the outside world while exposing only the required functionality. This improves code modularity, security, and maintainability."},{"n":5,"stem":[{"t":"text","v":"Consider the following code snippet"},{"t":"code","v":"class NPTEL_W2 {\n    int x;\n    NPTEL_W2(int x) {\n        this.x = x+1;\n    }\n    void printX() {\n        System.out.println(this.x);\n    }\n    public static void main(String[] args) {\n        NPTEL_W2 obj = new NPTEL_W2(100);\n        obj.printX();\n    }\n}"},{"t":"text","v":"What will be the output of the code given above?"}],"opts":["0","101","100","Runtime error"],"ans":1,"sol":"The constructor NPTEL_W2 (int x) initializes the instance variable x with the value passed as an argument. The method printX() prints the value of x, which is 101. Refer to Lecture 7 for more details."},{"n":6,"stem":[{"t":"text","v":"What does the this keyword in Java help to achieve?"}],"opts":["Avoiding name space collision between instance variables and method parameters","Overloading methods in a class","Accessing private methods in another class","Creating multiple objects in a program"],"ans":0,"sol":"The this keyword is used to refer to the current instance of a class. It is commonly used to resolve ambiguity when instance variables and method parameters have the same name. For example: class Example { int value; Example(int value) { this.value = value; // Resolves name collision by referring to the instance variable } } Here, this.value refers to the instance variable, while value refers to the parameter of the constructor. This avoids confusion and ensures the proper assignment of values. Please refer book Joy with Java Chapter 3 for mored etailed explaination."},{"n":7,"stem":[{"t":"text","v":"Which method is used as the starting point of execution in a Java program?"}],"opts":["init method","start method","main method","run method"],"ans":2,"sol":"You are encouraged to review the role of program execution flow in Java on your own. Note: Please refer to the book Joy with Java Chapter 3 for more detailed explanation."},{"n":8,"stem":[{"t":"text","v":"Which of the following is used to display output in Java?"}],"opts":["input","display","print","System"],"ans":2,"sol":"The print method is used to display output on the screen in Java. It is available through the System.out object. You should practice identifying commonly used output statements. Note: Please refer to the book Joy with Java Chapter 3 for more detailed explanation."},{"n":9,"stem":[{"t":"text","v":"Which symbol is used to end a statement in Java?"}],"opts":[":",".",";",","],"ans":2,"sol":"In Java, every statement must end with a semicolon. It tells the compiler that the statement is complete. Revise Java syntax rules carefully. Refer to Joy with Java Chapter 2 for clarification."},{"n":10,"stem":[{"t":"text","v":"Which of the following is a valid Java keyword?"}],"opts":["number","class","include","define"],"ans":1,"sol":"The class keyword is used to define a class in Java. Java keywords have predefined meanings. Students should memorize basic Java keywords. Note: Please refer to chapter 3 of book Joy With Java for a more detailed explaination. PROGRAMMING IN JAVA"}]},{"a":3,"qs":[{"n":1,"stem":[{"t":"text","v":"Which of the following statements is true regarding the order of execution of constructors in an inheritance hierarchy?"}],"opts":["Derived class constructor will be called followed by the base class constructor.","Only Base class constructor will be called.","Only derived class constructor will be called.","Base class constructor will be called followed by the derived class constructor."],"ans":3,"sol":"On object creation of a derived class, Java ensures that the base (parent) class constructor is executed first to initialize the parent's state before executing the derived class constructor."},{"n":2,"stem":[{"t":"text","v":"The super() method is used to:"}],"opts":["Call constructor of friend class","Call constructor of the parent class","Call constructor","Is a declared method"],"ans":1,"sol":"In Java, `super()` is used to invoke the constructor of the immediate parent class. It allows the subclass to initialize the parent class's state."},{"n":3,"stem":[{"t":"text","v":"What is the output of the following Java program?"},{"t":"code","v":"class Vehicle {\n    public void move() {\n        System.out.println(\"The vehicle moves\");\n    }\n}\nclass Car extends Vehicle {\n    public void move() {\n        System.out.println(\"The car moves\");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Vehicle vehicle = new Car();\n        vehicle.move();\n    }\n}"}],"opts":["\"The vehicle moves\"","\"The car moves\"","The code does not compile","None of the above"],"ans":1,"sol":"This is an example of method overriding. Since the object is instantiated as a `Car`, the overridden `move` method in the `Car` class is executed, even though the reference type is `Vehicle`."},{"n":4,"stem":[{"t":"text","v":"Which of the following is NOT true regarding the final keyword in Java?"}],"opts":["A final method cannot be overridden in a subclass.","A final variable can only be assigned once.","A final class can have subclasses.","A final variable can be assigned during declaration or in the constructor."],"ans":2,"sol":"A class marked as `final` cannot be extended, meaning it cannot be subclassed (it cannot have any child classes)."},{"n":5,"stem":[{"t":"text","v":"Which type of inheritance leads to the \"Diamond Problem\"?"}],"opts":["Single level","Multi-level","Multiple","Hierarchical"],"ans":2,"sol":"The diamond problem arises in multiple inheritance when a class inherits from two classes that have a common ancestor, leading to ambiguity regarding which path to follow for inherited members. Java avoids this by not supporting multiple inheritance with classes."},{"n":6,"stem":[{"t":"text","v":"Members of a class which are not intended to be inherited by subclasses should be declared as:"}],"opts":["Public members","Protected members","Private members","Private or Protected members"],"ans":2,"sol":"The `private` access specifier is the most restrictive. Private members are not visible to subclasses and therefore are not inherited."},{"n":7,"stem":[{"t":"text","v":"In Java, is it possible to override a static method?"}],"opts":["Yes, we can override a static method just like we do with instance methods.","No, static methods cannot be overridden because they belong to the class, not the object.","It depends on whether the static method is declared as final or not.","It depends on the access modifier of the static method."],"ans":1,"sol":"Static methods are bound to the class rather than the instance (static binding). If a subclass defines a static method with the same signature, it \"hides\" the parent method rather than overriding it."},{"n":8,"stem":[{"t":"text","v":"What is the output of the following Java program?"},{"t":"code","v":"public class NptelExample {\n    public static int fun(int n) {\n        if (n == 0) {\n            return 1;\n        }\n        return n * fun(n - 1);\n    }\n    public static void main(String[] args) {\n        System.out.println(fun(5));\n    }\n}"}],"opts":["5","24","120","Runtime Error"],"ans":2,"sol":"The `fun` method is a recursive function calculating the factorial of `n`. For input 5, it calculates 5 * 4 * 3 * 2 * 1 = 120."},{"n":9,"stem":[{"t":"text","v":"Which of the following statements about abstract classes in Java is correct?"}],"opts":["Abstract classes can be instantiated directly.","An abstract class must contain at least one abstract method.","A class inheriting from an abstract class must implement all its abstract methods unless it is itself abstract.","Abstract classes can be marked as final."],"ans":2,"sol":"Abstract classes cannot be instantiated. Any concrete subclass (non-abstract) must provide implementations for all abstract methods defined in the parent abstract class."},{"n":10,"stem":[{"t":"text","v":"What will be the output of the below program?"},{"t":"code","v":"class superDemoClass {\n    final int a = 20;\n}\nclass subDemoClass extends superDemoClass {\n    void subFunc() {\n        a = 40;\n        System.out.println(\"value of a = \" + a);\n    }\n}\nclass demo {\n    public static void main(String[] args) {\n        subDemoClass subc = new subDemoClass();\n        subc.subFunc();\n    }\n}"}],"opts":["value of a = 20","error: cannot assign a value to final variable a","error: unknown variable 'a' in class subDemoClass","value of a = 40"],"ans":1,"sol":"The variable `a` is declared as `final` in the superclass. While it is inherited, its value cannot be modified (re-assigned) by the subclass, causing a compilation error. NOC25-CS57 (JAN-2025 25S) PROGRAMMING IN JAVA"}]},{"a":4,"qs":[{"n":1,"stem":[{"t":"text","v":"Which access modifier allows access only inside the same package?"}],"opts":["default","private","public","protected"],"ans":0,"sol":"The default access modifier allows access within the same package only. It is applied when no access modifier is written. Revise package-level access rules carefully."},{"n":2,"stem":[{"t":"text","v":"Which constructor is called first when an object of a child class is created? The method will be accessible."}],"opts":["Child class constructor","Parent class constructor","Interface constructor","Package constructor"],"ans":1,"sol":"The parent class constructor is invoked first automatically. This happens through an implicit call to super(). Revisit inheritance basics and constructor order."},{"n":3,"stem":[{"t":"text","v":"What will be the output of the following code?"},{"t":"code","v":"class Person {\n    int a = 1;\n    int b = 0;\n    public Person() {\n        System.out.println(a + b + \" Java \" );\n    }\n}\nclass Employee extends Person {\n    int a = 0;\n    int b = 1;\n    public Employee() {\n        System.out.println(\"\"+a + b + \" Java \" );\n    }\n}\npublic class Question {\n    public static void main(String args[]) {\n        Person p = new Employee();\n    }\n}"}],"opts":["1 Java 10 0 Java 0","1 Java 0 Java","1 Java 01 Java","1 java 1 0 Java 0"],"ans":2,"sol":"If no super() or this() is included explicitly within the derived class constructor, the super() is implicitly invoked by the compiler. Therefore, in this case, the Person class constructor is called first and then the Employee class constructor is called. Up casting is allowed."},{"n":4,"stem":[{"t":"text","v":"Which statement is used to use a class from another package?"}],"opts":["package","include","import","extends"],"ans":2,"sol":"The import statement allows access to classes from other packages. It improves code readability and reuse. Practice basic import statements."},{"n":5,"stem":[{"t":"text","v":"What keyword is used to define a package in Java?"}],"opts":["define","package","import","namespace"],"ans":1,"sol":"The `package` keyword is used in Java to define a package. For example, `package mypackage;` defines a package named `mypackage`."},{"n":6,"stem":[{"t":"text","v":"How do you import a specific class from a package in Java?"}],"opts":["import package.*;","import package.ClassName;","include package.ClassName;","use package.ClassName;"],"ans":1,"sol":"The syntax `import package.ClassName;` imports a specific class from a package. For example, `import java.util.Scanner;` imports the `Scanner` class from the `java.util` package."},{"n":7,"stem":[{"t":"text","v":"Consider the following 2 programs:"},{"t":"code","v":"// Main1.java ------------------\npublic class Main1{\n    public static void main(String args[]){\n        int number = 10;\n        System.out.println(number++ + ++number);\n    }\n}\n// Main2.java ------------------\npublic class Main2{\n    public static void main(String args[]){\n        int number = 10;\n        System.out.println(++number + number++);\n    }\n}"},{"t":"text","v":"Choose the best option among the following for the code snippet given above"}],"opts":["Both pre-increment and post-increment operators becomes pre-increment during print.","Both pre-increment and post-increment operators becomes post-increment during print.","Both Main1 and Main2 classes give the same output.","Pre-increment and post-increment operators don’t work during print."],"ans":2,"sol":"The output of both the program are 22. Therefore, option c is correct and we can eliminate option d that the operators don’t work. Further, the operators are doing exactly what they are supposed to do i.e. pre- increment first increases the values and post-increment increases the value during the next operation. The print statement is the next operation; hence it received the post incremented value as well making option a and b invalid."},{"n":8,"stem":[{"t":"text","v":"Consider the code given below."},{"t":"code","v":"// Teacher.java ------------------\npackage nptel1;\npublic class Teacher {\n    protected void showMarks() {\n        System.out.println(\"100 Marks\");\n    }\n}\n// Student.java ------------------\npackage nptel2;\nimport nptel1.*;\npublic class Student extends Teacher {\n    void show() {\n        showMarks();\n    }\n    public static void main(String[] args) {\n        Student st1 = new Student();\n        st1.show();\n    }\n}"},{"t":"text","v":"What is the output of the above Java Code Snippet with protected access modifier?"}],"opts":["100 Marks","No output","Compiler error","None of the above"],"ans":0,"sol":"Through inheritance, one can access a protected variable or method of a class even from outside the package. Here, we accessed Teacher class of nptel1 from Student class of nptel2."},{"n":9,"stem":[{"t":"text","v":"What will happen if you do not specify an access modifier for a class in a package?"}],"opts":["The class will be `private` by default.","The class will be `protected` by default.","The class will be accessible only within the same package.","The class will be `public` by default."],"ans":2,"sol":"If no access modifier is specified for a class, it gets the default access level, making it accessible only within the same package."},{"n":10,"stem":[{"t":"text","v":"Which access modifier provides the most restrictive access in Java?"}],"opts":["default","protected","private","public"],"ans":2,"sol":"The `private` modifier provides the most restrictive access, allowing access only within the class where it is defined. PROGRAMMING IN JAVA"}]},{"a":5,"qs":[{"n":1,"stem":[{"t":"text","v":"Which keyword is NOT used by Java during exception handling?"}],"opts":["try","catch","final","finally"],"ans":2,"sol":"In Java, exceptions are handled using the try, catch, and finally blocks. The try block contains code that might throw an exception, the catch block handles specific exceptions, and the finally block executes regardless of whether an exception occurs."},{"n":2,"stem":[{"t":"text","v":"What is the purpose of the throws keyword in Java?"}],"opts":["To declare exceptions that a method can throw","To throw an exception immediately","To catch an exception","It is not a keyword in Java"],"ans":0,"sol":"The throws keyword is used in a method signature to declare the exceptions that the method might throw, alerting callers to handle or propagate these exceptions."},{"n":3,"stem":[{"t":"text","v":"Which of the following is TRUE about interfaces in Java?"}],"opts":["Interfaces should always be defined as final","Interfaces can be instantiated directly.","Interfaces can extend multiple interfaces.","Interfaces cannot have any method signatures"],"ans":2,"sol":"In Java, an interface can extend multiple interfaces. Interfaces can also contain public, static, and final variables, but they cannot be instantiated directly."},{"n":4,"stem":[{"t":"text","v":"What will be the output of the following code?"},{"t":"code","v":"interface Demo {\n    void display();\n}\nclass Test implements Demo {\n    public void display() {\n        System.out.println(\"Hello, NPTEL!\");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Test obj = new Test();\n        obj.display();\n    }\n}"}],"opts":["Hello, NPTEL!","Compilation Error","Runtime Error","No Output"],"ans":0,"sol":"The Test class implements the Demo interface and provides a definition for the display method. When display() is called, it prints “Hello, NPTEL!”."},{"n":5,"stem":[{"t":"text","v":"What will be the output of the following Java program?"},{"t":"code","v":"interface Calculator {\n    void calculate(int value);\n}\nclass Square implements Calculator {\n    int result;\n    public void calculate(int value) {\n        result = value * value;\n        System.out.print(\"Square: \" + result + \" \");\n    }\n}\nclass Cube extends Square {\n    public void calculate(int value) {\n        result = value * value * value;\n        super.calculate(value);\n        System.out.print(\"Cube: \" + result + \" \");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Calculator obj = new Cube();\n        obj.calculate(3);\n    }\n}"}],"opts":["Square: 9 Cube: 9","Cube: 27 Square: 9","Square: 9 Square: 27 Cube: 27","Square: 9 Cube: 27 Square: 27"],"ans":0,"sol":"The Cube class overrides the calculate method of the Square class. In the Cube class’s calculate method, super.calculate(value) is called, which executes the calculate method of the Square class. First, \"Square: 9\" is printed by the superclass method. The call to super.calculate(value) overwrites the previously computed cube value. Then, the overridden method in Cube prints \"Cube: 9\"."},{"n":6,"stem":[{"t":"text","v":"What will be the output of the following program?"},{"t":"code","v":"class NPTEL {\n    public static void main(String[] args) {\n        try {\n            int a = 5;\n            int b = 0;\n            System.out.println(a / b);\n        } catch (ArithmeticException e) {\n            System.out.print(\"Error \");\n        } finally {\n            System.out.print(\"Complete\");\n        }\n    }\n}"}],"opts":["5 Complete","Error Complete","Runtime Error","Compilation Error"],"ans":1,"sol":"An ArithmeticException is caught in the catch block, which prints “Error”. The finally block executes afterward, printing “Complete”."},{"n":7,"stem":[{"t":"text","v":"What will be the output of the following Java program?"},{"t":"code","v":"interface A {\n    int x = 10;\n    void display();\n}\nclass B implements A {\n    public void display() {\n        System.out.println(\"Value of x: \" + x);\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        B obj = new B();\n        obj.display();\n    }\n}"}],"opts":["Value of x: 10","Value of x: 0","Compilation Error","Runtime Error"],"ans":0,"sol":"Variables in interfaces are public, static, and final by default. Hence, the value of x is accessible in the display method."},{"n":8,"stem":[{"t":"text","v":"Which keyword is used by Java during exception ln(i);\n    }\n}"}],"opts":["30","Compiler Error","Garbage value","0"],"ans":1,"sol":"i is assigned a value twice. Final variables can be assigned values only one. Following is the compiler error “Main.java:5: error: variable i might already have been assigned”."},{"n":4,"stem":[{"t":"text","v":"Which of these values is returned by read() method when the end of file (EOF) is encountered?"}],"opts":["0","1","-1","Null"],"ans":2,"sol":"Each time read() is called, it reads a single byte from the file and returns the byte as an integer value. read() returns -1 when the end of the file is encountered."},{"n":5,"stem":[{"t":"text","v":"What will be the output of the following Java program?"},{"t":"code","v":"public class Calculator {\n    int num = 100;\n    public void calc(int num) {\n        this.num = num * 10;\n    }\n    public void printNum() {\n        System.out.println(num);\n    }\n    public static void main(String[] args) {\n        Calculator obj = new Calculator();\n        obj.calc(2);\n        obj.printNum();\n    }\n}"}],"opts":["20","100","1000","2"],"ans":0,"sol":"Here the class instance variable name(num) is same as calc() method local variable name(num). So for referencing class instance variable from calc() method, this keyword is used. So in statement this.num = num * 10, num represents local variable of the method whose value is 2 and this.num represents class instance variable whose initial value is 100. Now in printNum() method, as it has no local variable whose name is same as class instance variable, so we can directly use num to reference instance variable, although this.num can be used."},{"n":6,"stem":[{"t":"text","v":"What is the primary difference between Byte Streams and Character Streams in Java?"}],"opts":["Byte Streams handle characters, while Character Streams handle bytes.","Byte Streams are used for binary data, while Character Streams are used for image data.","Character Streams are faster than Byte Streams in all cases.","Byte Streams are used for binary data, while Character Streams are used for text data."],"ans":3,"sol":"Byte Streams: Handle raw binary data like images or files (InputStream, OutputStream). Character Streams: Handle text data and support encoding like Unicode (Reader, Writer). Character Streams are better for text processing, especially when handling international characters. For a detailed understanding of Java I/O streams, refer to the book Joy with Java."},{"n":7,"stem":[{"t":"text","v":"What is the primary purpose of thread synchronization in Java?"}],"opts":["To allow multiple threads to execute a method at the same time","To ensure thread execution follows a specific order","To prevent rare conditions and ensure data in-consistency","To prevent race conditions and ensure data consistency"],"ans":3,"sol":"Thread synchronization is used to control the access of multiple threads to shared resources, ensuring data consistency and preventing race conditions. This is typically done using synchronized methods or blocks. For more details on thread synchronization, refer to the book Joy with Java."},{"n":8,"stem":[{"t":"text","v":"Which stream does Java application uses to only READ data from a source, it may be a file, an array, peripheral device or socket?"}],"opts":["InputStream","OutputStream","Input/OutputStream","DataOutputStream"],"ans":0,"sol":"InputStream is used to read data from any source in Java."},{"n":9,"stem":[{"t":"text","v":"Which class in Java is used to create a new directory?"}],"opts":["FileReader","FileWriter","File","Directory"],"ans":2,"sol":"The File class is used to create directories and manipulate files."},{"n":10,"stem":[{"t":"text","v":"What is the primary purpose of input streams in Java?"}],"opts":["To write data to a file.","To read data from a file.","To delete a file.","To create directories."],"ans":1,"sol":"Input streams are used to read data from a file or another source. PROGRAMMING IN JAVA"}]},{"a":8,"qs":[{"n":1,"stem":[{"t":"text","  value does getPort() return if no port is specified in the URL?"}],"opts":["0","80","-1","443"],"ans":2,"sol":"If a port number is not explicitly mentioned in the URL, getPort() returns -1."},{"n":8,"stem":[{"t":"text","v":"Which protocol is connectionless?"}],"opts":["TCP","HTTP","UDP","SMTP"],"ans":2,"sol":"UDP is a connectionless protocol that sends data as packets without establishing a connection."},{"n":9,"stem":[{"t":"text","v":"Which method is used by a client to establish a connection with a server?"}],"opts":["accept()","connect()","listen()","open()"],"ans":1,"sol":"A client uses the connect() method internally when creating a Socket to establish a connection with the server."},{"n":10,"stem":[{"t":"text","v":"Which layer of the OSI model does TCP belong to?"}],"opts":["Application layer","Network layer","Transport layer","Data link layer"],"ans":2,"sol":"TCP operates at the transport layer and provides reliable, ordered, and error-checked data delivery. PROGRAMMING IN JAVA"}]},{"a":11,"qs":[{"n":1,"stem":[{"t":"text","v":"How do you establish a connection to a database using JDBC?"}],"opts":["By creating an instance of the Connection interface","By using the DriverManager.getConnection() method","By implementing the Connection interface","By extending the Connection class"],"ans":1,"sol":"To establish a connection to a database using JDBC, you use the DriverManager.getConnection() method. This method takes a JDBC URL, username, and password as parameters and returns a Connection object, which represents a connection to the database. The JDBC URL specifies the database type, location, and other connection details."},{"n":2,"stem":[{"t":"text","v":"Which method executes a simple query and returns a single Result Set object?"}],"opts":["executeQuery()","executeUpdate()","execute()","run()"],"ans":0,"sol":"The executeQuery() method is used to execute a simple SQL query that returns a single ResultSet object."},{"n":3,"stem":[{"t":"text","v":"Which of the following ensures that the correct driver is used to access each data source?"}],"opts":["java.sql.Manager","java.sql.DriverManager","java.sql.Statement","java.sql.DriverSession"],"ans":1,"sol":"The DriverManager class ensures that the correct driver is used to access each data source. It manages a list of database drivers and handles establishing connections to the database."},{"n":4,"stem":[{"t":"text","v":"What is the purpose of the ResultSet interface in JDBC?"}],"opts":["To store the result of a query","To execute SQL queries","To manage database connections","To update data in the database"],"ans":0,"sol":"The ResultSet interface in JDBC represents the result set returned by a query. It provides methods to navigate through the result set, retrieve data, and get information about the columns in the result set. The ResultSet interface allows you to process and extract data from a database query."},{"n":5,"stem":[{"t":"text","v":"What does setAutoCommit(false) do?"}],"opts":["commits transaction after each query","explicitly commits transaction","does not commit transaction automatically after each query","never commits transaction"],"ans":2,"sol":"setAutoCommit(false) does not commit transaction automatically after each query. That saves a lot of time of the execution and hence improves performance."},{"n":6,"stem":[{"t":"text","v":"The following is a statement in Java using JDBC."},{"t":"code","v":"Connection con = DriverManager.getConnection(\n\"jdbc:mysql://localhost:3306/nptel\",\"joy\",\"java\"\n);"},{"t":"text","v":"Which of the following statement is FALSE?"}],"opts":["3306 is the default MySQL port.","Database name is ‘nptel’","The database server is hosted on IP 127.0.0.1","Username is ‘java’ and the password is ‘joy’"],"ans":3,"sol":"In the statement, joy is the username and java is the password. Therefore, statement d, which incorrectly claims that the password for the java user is joy, is false."},{"n":7,"stem":[{"t":"text","v":"What is the correct order to close database resources?"}],"opts":["Connection then Statement then ResultSet","ResultSet then Statement then Connection","Statement then Connection then ResultSet","Statement then ResultSet then Connection"],"ans":1,"sol":"The correct order to close database resources is to first close the ResultSet, then the Statement, and finally the Connection. This ensures that all resources are properly released in the correct sequence."},{"n":8,"stem":[{"t":"text","v":"What is the full form of JDBC?"}],"opts":["Java Database Connectivity","Java Data Code","Java Data Communication","Java Development Connectivity"],"ans":0,"sol":"JDBC stands for Java Database Connectivity, a Java API used to connect and interact with relational databases. It provides methods to query and update data in a database."},{"n":9,"stem":[{"t":"text","v":"Fill in the missing code to establish a connection to a MySQL database."},{"t":"code","v":"import java.sql.*;\npublic class JDBCExample {\n    public static void main(String[] args) {\n        try {\n            // Load JDBC Driver\n            Class.forName(\"com.mysql.cj.jdbc.Driver\");\n            // Establish Connection\n            Connection connection = // INSERT CODE HERE;\n            System.out.println(\"Connected to the database.\");\n            connection.close();\n        } catch (Exception e) {\n            e.printStackTrace();\n        }\n    }\n}"},{"t":"text","v":"What should replace // INSERT CODE HERE ?"}],"opts":["DriverManager.connect(\"mysql:localhost:mydb\", \"user\", \"password\");","DriverManager.getConnection(\"jdbc:mysql://localhost:3306/mydb\", \"user\", \"password\");","Connection.get(\"jdbc:mysql://localhost:3306/mydb\", \"user\", \"password\");","Driver.connect(\"jdbc:mysql://localhost:mydb\", \"user\", \"password\");"],"ans":1,"sol":"The DriverManager.getConnection method establishes a connection to the specified database URL with the provided username and password."},{"n":10,"stem":[{"t":"text","v":"What is the purpose of the DriverManager class in JDBC?"}],"opts":["To manage database connections.","To execute SQL queries.","To fetch data from a database.","To represent a database record."],"ans":0,"sol":"The DriverManager class loads the JDBC drivers and establishes connections to databases. PROGRAMMING IN JAVA"}]},{"a":12,"qs":[{"n":1,"stem":[{"t":"text","v":"Which JDBC object is used to iterate over records returned by a SELECT query?"}],"opts":["Statement","Connection","ResultSet","DriverManager"],"ans":2,"sol":"A ResultSet object stores and allows traversal of rows returned by a SELECT query."},{"n":2,"stem":[{"t":"text","v":"Which method is used to display a Swing JFrame on the screen?"}],"opts":["display()","setVisible(true)","showFrame()","open()"],"ans":1,"sol":"A Swing frame becomes visible only after calling setVisible(true)."},{"n":3,"stem":[{"t":"text","v":"What is the index of the first element in a Java array?"}],"opts":["1","-1","0","Depends on array size"],"ans":2,"sol":"Java arrays are zero-indexed."},{"n":4,"stem":[{"t":"text","v":"Consider the following program: (note space appears only one at a time)"},{"t":"code","v":"public class Question {\n    public static void main(String[] args) {\n        String str = \"NPTEL - Programming in JAVA - JAN 2026\";\n        System.out.println(str.length());\n    }\n}"}],"opts":["38","39","40","41"],"ans":0,"sol":"The provided Java program calculates and prints the length of the string str, which contains the text \"NPTEL - Programming in JAVA - JAN 2026\". The output of this program will be: 38"},{"n":5,"stem":[{"t":"text","v":"Which keyword is used to handle exceptions in Java?"}],"opts":["error","handle","catch","throwable"],"ans":2,"sol":"The catch block handles exceptions thrown in the try block."},{"n":6,"stem":[{"t":"text","v":"What is the output of the following program?"},{"t":"code","v":"public class Test {\n    public static void aMethod() throws Exception {\n        try {\n            throw new Exception();\n        } finally {\n            System.out.print(\"finally \");\n        }\n    }\n    public static void main(String args[]) {\n        try {\n            aMethod();\n        } catch (Exception e) {\n            System.out.print(\"exception \");\n        }\n        System.out.print(\"finished \");\n    }\n}"}],"opts":["finally","exception finished","finally exception finished","Compilation fails"],"ans":2,"sol":"The program is syntactically correct and here for two try blocks, there is one catch block. Here's the step-by-step explanation: I. The main method calls aMethod(), which throws an Exception. II. Inside aMethod(), an Exception is thrown in the try block. III. The finally block is always executed, regardless of whether an exception is thrown or not. In this case, it prints \"finally \". IV. Since aMethod() throws an Exception, control moves to the catch block in main. V. The catch block prints \"exception \". VI. After the try-catch block in main, \"finished \" is printed. VII. Therefore, the complete output is \"finally exception finished\"."},{"n":7,"stem":[{"t":"text","v":"What is the output of the following program?"},{"t":"code","v":"class Program {\n    public static void main(String[] args) {\n        int counter = 10;\n        do {\n            System.out.print(2 / counter);\n            counter--;\n        } while (counter > 2);\n    }\n}"}],"opts":["00000012","00000000","10011001","12211221"],"ans":1,"sol":"The provided program uses a do-while loop to iterate from counter = 10 down to counter = 3. During each iteration, it prints the result of 2 / counter. 1. counter = 10: 2 / 10 results in 0 (integer division). 2. counter = 9: 2 / 9 results in 0. 3. counter = 8: 2 / 8 results in 0. 4. counter = 7: 2 / 7 results in 0. 5. counter = 6: 2 / 6 results in 0. 6. counter = 5: 2 / 5 results in 0. 7. counter = 4: 2 / 4 results in 0. 8. When counter = 3: 2 / 3 results in 0. After counter becomes 2, the loop condition counter > 2 fails, and the loop terminates. Therefore, the output of the program is 00000000."},{"n":8,"stem":[{"t":"text","v":"What should be the value of X and Y for the output of the below program to be 36?"},{"t":"code","v":"public class Question {\n    public static void main(String[] args) {\n        int X = 4;\n        int Y = 5;\n        int sum = 0;\n        for (int i = 0; i < X; i++) {\n            for (int j = i; j < Y; j++) {\n                sum = sum + j;\n            }\n        }\n        System.out.print(sum);\n    }\n}"}],"opts":["X = 6 and Y = 5","X = 2 and Y = 7","X = 1 and Y = 10","X = 4 and Y = 5"],"ans":3,"sol":"The following is the output of the program for different values of X and Y: a. when X = 6 and Y = 5 output is 40 b. when X = 2 and Y = 7 output is 42 c. when X = 1 and Y = 10 output is 45 d. when X = 4 and Y = 5 output is 36"},{"n":9,"stem":[{"t":"text","v":"Which of the following options correctly initializes the elements of the numbers array with values 1, 2, 3, 4, and 5?"},{"t":"code","v":"public class NPTEL {\n    public static void main(String[] args) {\n        int[] numbers = new int[5];\n        // #1 : Missing code block\n        System.out.println(\"First element: \" + numbers[0]);\n    }\n}"}],"opts":["numbers = {1, 2, 3, 4, 5};","for (int i = 1; i < numbers.length; i++) { numbers[i] = i; }","numbers[] = {1, 2, 3, 4, 5};","numbers = new int[]{1, 2, 3, 4, 5};"],"ans":3,"sol":"numbers = new int[]{1, 2, 3, 4, 5}; is the correct answer because it initializes the numbers array with values 1, 2, 3, 4, and 5 using array initializer syntax."},{"n":10,"stem":[{"t":"text","v":"Which of the following statements are correct and would NOT cause a compilation error?"},{"t":"code","v":"I.     float[] = new float(3);\nII.     float f1[] = new float[];\nIII.     float[] f2 = new float[3];\nIV.     float f3[] = new float[3];\nV.     float f4[]= { 1.0f, 2.0f, 2.0f };\nVI.     float f5[] = new float[] { 1.0f, 2.0f, 3.0f};"}],"opts":["iii, iv, v, vi","i, ii, iii, iv","ii, iii, v, vi","i, ii, iv, vi"],"ans":0,"sol":"Option iii, iv, v and vi are syntactically correct for declaration of an array."}]}];
const KEY="nptel-java-quiz-v1";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
let cur=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const id=(a,n)=>a+"-"+n;
const s=(a,n)=>st[id(a,n)]||{w:[],c:false};
const L="abcd";
const esc=x=>x.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function stats(A){let c=0;A.qs.forEach(q=>{if(s(A.a,q.n).c)c++});return c}
function tabs(){const el=document.getElementById("tabs");el.innerHTML="";DATA.forEach((A,i)=>{const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===cur);b.innerHTML="A"+A.a+"<small>"+stats(A)+"/"+A.qs.length+"</small>";b.onclick=()=>{cur=i;render()};el.appendChild(b)})}
function render(){
 tabs();const A=DATA[cur];
 document.getElementById("score").textContent="Assignment "+A.a+": "+stats(A)+" / "+A.qs.length+" correct";
 const list=document.getElementById("list");list.innerHTML="";
 A.qs.forEach(q=>{
  const S=s(A.a,q.n),sec=document.createElement("section");sec.className="q";
  let h='<div class="qh"><span class="qn">Question '+q.n+'</span><button class="btn" data-r="1">Reset</button></div>';
  q.stem.forEach(p=>{h+=p.t==="code"?"<pre><code>"+esc(p.v)+"</code></pre>":"<p>"+esc(p.v)+"</p>"});
  h+='<div class="opts">';
  q.opts.forEach((o,i)=>{
   const right=S.c&&i===q.ans,wrong=S.w.includes(i);
   h+='<button class="opt'+(right?" ok":"")+(wrong?" no":"")+'" data-i="'+i+'"'+(S.c||wrong?" disabled":"")+'><span class="l">'+L[i]+'.</span><span class="t">'+esc(o)+'</span><span class="m">'+(right?"✓":wrong?"✗":"")+'</span></button>'});
  h+="</div>";
  if(S.c&&q.sol)h+='<div class="sol">'+esc(q.sol)+"</div>";
  else if(S.w.length)h+='<div class="hint">Not quite. Try another option, or reset to start over.</div>';
  sec.innerHTML=h;
  sec.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const i=+b.dataset.i,k=id(A.a,q.n);st[k]=st[k]||{w:[],c:false};
   if(i===q.ans)st[k].c=true;else if(!st[k].w.includes(i))st[k].w.push(i);
   save();render();});
  sec.querySelector("[data-r]").onclick=()=>{delete st[id(A.a,q.n)];save();render()};
  list.appendChild(sec)});
}
document.getElementById("resetA").onclick=()=>{DATA[cur].qs.forEach(q=>delete st[id(DATA[cur].a,q.n)]);save();render()};
document.getElementById("resetAll").onclick=()=>{if(confirm("Clear all answers in every assignment?")){st={};save();render()}};
render();
</script></body></html>
